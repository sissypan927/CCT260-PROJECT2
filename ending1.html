<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escape Successful!</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Page-specific overrides */
        body {
            background: #000 url('https://cdn.glitch.global/4a7df820-baeb-4964-a116-d8ae284b35e2/mansion-exterior.jpg') no-repeat center/cover;
        }
        .ending-container {
            background-color: rgba(0, 0, 0, 0.8);
            border: 2px solid #0f9d58;
        }
        .ending-title {
            color: #0f9d58;
            text-shadow: 0 0 10px rgba(15, 157, 88, 0.7);
        }
        .ending-text {
            color: #fff;
            line-height: 1.6;
        }

<body>
    <div class="container">
        <div class="ending-container">
            <h1 class="ending-title">ESCAPE SUCCESSFUL!</h1>

                <p>You've uncovered the mansion's secret: </p>
                <p>A scientist's failed experiment caused all the disappearances.</p>
                <p>By revealing the truth, you've become legends!</p>
            </div>
            <button id="restartButton" class="restart-btn">PLAY AGAIN</button>
        </div>
    </div>
    <script src="script.js"></script>

</html>
