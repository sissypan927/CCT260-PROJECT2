<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Choose a Door</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <p>The key clicks in the lock. Before you stand two ancient doors, each radiating a different energy:</p>

  <div class="door-row">
    <div class="door-option">
      <img src="red_door.png" alt="Red Door">
      <div class="door-label">Enter the Left Door</div>
    </div>

    <div class="door-option">
      <img src="blue_door.png" alt="Blue Door">
      <div class="door-label">Enter the Right Door</div>
    </div>
  </div>

</body>
</html>
