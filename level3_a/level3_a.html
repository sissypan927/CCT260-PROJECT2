<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Choose a Door</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="scene-wrapper">
    <p class="narration">
      The key clicks in the lock. Before you stand two ancient doors, each radiating a different energy:
    </p>

    <img src="red_and_blue_doors_scene.png" class="scene-image" alt="Two Doors" />

    <div class="choice-row">
      <div class="choice-box">
        <img src="https://cdn.glitch.global/4a7df820-baeb-4964-a116-d8ae284b35e2/red-door.png?v=1743377763162" class="choice-img" alt="Red Door">
        <div class="choice-label">Enter the Left Door</div>
      </div>

      <div class="choice-box">
        <img src="https://cdn.glitch.global/4a7df820-baeb-4964-a116-d8ae284b35e2/blue-door.png?v=1743378598732" class="choice-img" alt="Blue Door">
        <div class="choice-label">Enter the Right Door</div>
      </div>
    </div>
  </div>
</body>
</html>
