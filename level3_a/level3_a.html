<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Escape Room - Level 3</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <div id="text-frame">
            <p id="text">
                The key fits perfectly! With a click, a hidden panel slides open, 
                revealing two mysterious doorways before you:
            </p>
            
            <div class="doors-container">
                <div class="door-option" data-door="red">
                    <img class="door-image" 
                         src="https://cdn.glitch.global/4a7df820-baeb-4964-a116-d8ae284b35e2/red-door.png?v=1743039311412" 
                         alt="Red Door">
                    <p class="door-label">Red Door</p>
                </div>
                
                <div class="door-option" data-door="blue">
                    <img class="door-image" 
                         src="https://cdn.glitch.global/4a7df820-baeb-4964-a116-d8ae284b35e2/blue-door.png?v=1743039311413" 
                         alt="Blue Door">
                    <p class="door-label">Blue Door</p>
                </div>
            </div>
            
            <p id="level3-hint">The air hums with energy... your choice will echo through eternity</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
