<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Choose a Light</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-container">
    <img src="your-neutral-passage-image.png" class="interior-image" alt="Secret Passage"/>

    <div class="narrative-box">
      <p>Following the map, you find a secret passage. At the end, two candle flames flicker faintly: one green and one yellow. Which will you choose?</p>
    </div>

    <div class="options-container">
      <a href="green_path.html" class="option">
        <img src="green-flame-image.png" class="option-icon" alt="Green Flame">
        <div class="button">Choose the green flame</div>
      </a>
      
      <a href="yellow_path.html" class="option">
        <img src="yellow-flame-image.png" class="option-icon" alt="Yellow Flame">
        <div class="button">Choose the yellow flame</div>
      </a>
    </div>
  </div>
</body>
</html>
